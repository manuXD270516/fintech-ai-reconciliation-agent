# M0 local NATS with JetStream. Reachable only on the internal Compose network.
server_name: recon-m0-nats
listen: 0.0.0.0:4222
http: 0.0.0.0:8222

jetstream {
  store_dir: /data/jetstream
  max_memory_store: 64MB
  max_file_store: 1GB
}

authorization {
  users: [
    { user: $NATS_APP_USER, password: $NATS_APP_PASSWORD }
  ]
}
