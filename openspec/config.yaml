schema: spec-driven

context: |
  Project: fintech-ai-reconciliation-agent. Current phase: documentation only; do not implement code.
  FastAPI modular monolith, PostgreSQL + pgvector, NATS JetStream, read-only MCP.
  Synthetic data only. Deterministic reconciliation first; AI only for ambiguity.
  Operational decisions require human approval; no financial execution in M0-M10.
  Every substantial change requires proposal, requirements, acceptance criteria, design, tasks and test strategy.
  Metrics distinguish MEASURED, SIMULATED and EXPECTED. First change covers M0 only.
  Language: Spanish
  All artifacts must be written in Spanish.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
