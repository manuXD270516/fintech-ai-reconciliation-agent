# M0 local stack. Images are pinned by multi-arch index digest (never `latest`).
# Only the API is published, and only on 127.0.0.1. PostgreSQL and NATS live on an
# internal network with no published ports.
name: recon-m0

x-postgres-image: &postgres-image pgvector/pgvector:0.8.6-pg17-trixie@sha256:724a4041afdb1750446e3f6b5cfa8f3b0ac5a2cf538ddfa6bfee4f94c2fa85c6
x-nats-image: &nats-image nats:2.14.7-alpine3.22@sha256:4063edae0717ba5f7501bfde75f97fd9b57f5b93597b92c70b6a6fbbf6a74e06

x-app-env: &app-env
  APP_DB_HOST: postgres
  APP_DB_PORT: "5432"
  APP_DB_NAME: ${POSTGRES_DB:?set POSTGRES_DB in .env (copy .env.example)}
  APP_DB_USER: ${APP_DB_USER:?set APP_DB_USER in .env (copy .env.example)}
  APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env (copy .env.example)}
  APP_NATS_URL: nats://nats:4222
  APP_NATS_USER: ${NATS_APP_USER:?set NATS_APP_USER in .env (copy .env.example)}
  APP_NATS_PASSWORD: ${NATS_APP_PASSWORD:?set NATS_APP_PASSWORD in .env (copy .env.example)}
  APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
  APP_READY_TIMEOUT_SECONDS: ${APP_READY_TIMEOUT_SECONDS:-2.5}
  # M9 tracing is off unless set (profile `observability`: http://otel-collector:4318).
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

x-mcp-db-env: &mcp-db-env
  MCP_DB_HOST: postgres
  MCP_DB_PORT: "5432"
  MCP_DB_NAME: ${POSTGRES_DB:?set POSTGRES_DB in .env (copy .env.example)}
  MCP_DB_USER: ${MCP_DB_USER:?set MCP_DB_USER in .env (copy .env.example)}
  MCP_DB_PASSWORD: ${MCP_DB_PASSWORD:?set MCP_DB_PASSWORD in .env (copy .env.example)}

services:
  postgres:
    image: *postgres-image
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env (copy .env.example)}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?set POSTGRES_ADMIN_USER in .env (copy .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD in .env (copy .env.example)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      # TCP on purpose: during first-time init the image runs a temporary server that
      # listens only on the Unix socket; db-init must not start until TCP is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30

  db-init:
    image: *postgres-image
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:?set POSTGRES_DB in .env (copy .env.example)}
      PGUSER: ${POSTGRES_ADMIN_USER:?set POSTGRES_ADMIN_USER in .env (copy .env.example)}
      PGPASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD in .env (copy .env.example)}
      APP_DB_USER: ${APP_DB_USER:?set APP_DB_USER in .env (copy .env.example)}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env (copy .env.example)}
      MCP_DB_USER: ${MCP_DB_USER:?set MCP_DB_USER in .env (copy .env.example)}
      MCP_DB_PASSWORD: ${MCP_DB_PASSWORD:?set MCP_DB_PASSWORD in .env (copy .env.example)}
    volumes:
      - ./infra/postgres/init.sql:/init/init.sql:ro
    entrypoint: ["psql", "--no-psqlrc", "--quiet", "-f", "/init/init.sql"]
    networks: [backend]
    restart: "no"

  # One-shot Alembic job. Uses the bootstrap role to own the schema and grants the
  # runtime role only the DML it needs (observations and audit are append-only).
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    image: recon-m0-api:local
    command: ["python", "-m", "recon_store.migrate"]
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      MIGRATE_DB_HOST: postgres
      MIGRATE_DB_PORT: "5432"
      MIGRATE_DB_NAME: ${POSTGRES_DB:?set POSTGRES_DB in .env (copy .env.example)}
      MIGRATE_DB_USER: ${POSTGRES_ADMIN_USER:?set POSTGRES_ADMIN_USER in .env (copy .env.example)}
      MIGRATE_DB_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD in .env (copy .env.example)}
      APP_DB_USER: ${APP_DB_USER:?set APP_DB_USER in .env (copy .env.example)}
      MCP_DB_USER: ${MCP_DB_USER:?set MCP_DB_USER in .env (copy .env.example)}
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"

  # One-shot M3 job: publishes the synthetic knowledge corpus (idempotent per
  # document version) with the restricted runtime role.
  knowledge-ingest:
    image: recon-m0-api:local
    command: ["python", "-m", "recon_knowledge", "ingest", "--corpus", "/app/datasets/synthetic/knowledge-v1", "--provider-status", "/app/datasets/synthetic/provider-status-v1/status.json"]
    environment:
      <<: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"

  nats:
    image: *nats-image
    command: ["-c", "/etc/nats/nats.conf"]
    environment:
      NATS_APP_USER: ${NATS_APP_USER:?set NATS_APP_USER in .env (copy .env.example)}
      NATS_APP_PASSWORD: ${NATS_APP_PASSWORD:?set NATS_APP_PASSWORD in .env (copy .env.example)}
    volumes:
      - ./infra/nats/nats.conf:/etc/nats/nats.conf:ro
      - natsdata:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    image: recon-m0-api:local
    environment:
      <<: *app-env
      APP_HTTP_HOST: 0.0.0.0
      APP_HTTP_PORT: "8000"
      # M10 kill switch: false refuses new AI investigations (deterministic path unaffected).
      APP_AI_ENABLED: ${APP_AI_ENABLED:-true}
      # Ruleset for new runs (runbook ruleset-rollback); rules/v2 is a synthetic drill variant.
      APP_RULESET: ${APP_RULESET:-rules/v1}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-18180}:8000"
    volumes:
      # Public JWKS only (scripts/dev_auth.py init); the private key never enters a container.
      - ./.dev-keys/public:/run/auth:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    networks: [backend, edge]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Outbox relay to JetStream and reconciliation run consumer (inbox-deduplicated).
  worker:
    image: recon-m0-api:local
    command: ["python", "-m", "recon_worker"]
    environment:
      <<: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  # M5 investigation worker: separate process with its own permissions. Launches
  # fintech-mcp-server (stdio, read-only role) per investigation. The model provider is the
  # deterministic scripted stand-in unless RECON_MODEL_PROVIDER=ollama (profile `ollama`).
  investigator:
    image: recon-m0-api:local
    command: ["python", "-m", "recon_investigator"]
    environment:
      <<: [*app-env, *mcp-db-env]
      RECON_MODEL_PROVIDER: ${RECON_MODEL_PROVIDER:-scripted}
      RECON_OLLAMA_URL: http://ollama:11434
      RECON_OLLAMA_MODEL: ${RECON_OLLAMA_MODEL:-qwen2.5:0.5b}
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  # Optional local model (D03). Never started by default or by any gate. Internal network
  # only; the model is pulled on demand: docker compose --profile ollama exec ollama
  # ollama pull qwen2.5:0.5b   (then set RECON_MODEL_PROVIDER=ollama for the investigator).
  ollama:
    profiles: [ollama]
    image: ollama/ollama:0.35.0@sha256:2a6e883b917fc543389599dae79918f5cac9e1438890506982f44aa4f5625d01
    networks: [backend]
    volumes:
      - ollamadata:/root/.ollama
    restart: "no"

  # --- observability profile (M9, D09): optional, never started by default or by a gate ---
  # OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318 docker compose --profile observability up -d
  # Jaeger UI: http://127.0.0.1:18186 (loopback only). Traces live in memory.
  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector:0.162.0@sha256:310a800ad69ee430e7c541796852a242c9c7db97aaad4daa5ccf843c525fbdb2
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      jaeger:
        condition: service_started
    networks: [backend]
    restart: "no"

  jaeger:
    profiles: [observability]
    image: jaegertracing/jaeger:2.21.0@sha256:3d0ac795ff98aa04d1be04311d2dac6c25b4bfc8322dc02e53bc5b170c5018c3
    ports:
      - "127.0.0.1:${JAEGER_HOST_PORT:-18186}:16686"
    networks: [backend, edge]
    restart: "no"

  # --- smoke profile: test-only services, never started by a plain `docker compose up` ---
  nats-nojs:
    profiles: [smoke]
    image: *nats-image
    command: ["--name", "recon-m0-nats-nojs", "-p", "4222"]
    networks: [backend]

  smoke:
    profiles: [smoke]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: smoke
    image: recon-m0-smoke:local
    environment:
      <<: [*app-env, *mcp-db-env]
      SMOKE_PG_ADMIN_USER: ${POSTGRES_ADMIN_USER:?set POSTGRES_ADMIN_USER in .env (copy .env.example)}
      SMOKE_PG_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD in .env (copy .env.example)}
      SMOKE_NATS_NOJS_URL: nats://nats-nojs:4222
    depends_on:
      nats-nojs:
        condition: service_started
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]

networks:
  backend:
    internal: true
  edge: {}

volumes:
  pgdata:
  natsdata:
  ollamadata:
