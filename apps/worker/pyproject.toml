[project]
name = "recon-worker"
version = "0.1.0"
description = "Background worker: outbox relay and reconciliation run consumer"
requires-python = "==3.12.*"
dependencies = [
    "recon-api",
    "recon-domain",
    "recon-store",
    "nats-py==2.16.0",
]

[tool.uv.sources]
recon-api = { workspace = true }
recon-domain = { workspace = true }
recon-store = { workspace = true }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recon_worker"]
