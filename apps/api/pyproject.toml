[project]
name = "recon-api"
version = "0.0.0"
description = "M0 HTTP adapter: health endpoints only"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "psycopg[binary]==3.3.6",
    "nats-py==2.16.0",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recon_api"]
