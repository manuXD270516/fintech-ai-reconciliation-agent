[project]
name = "recon-domain"
version = "0.1.0"
description = "Pure transaction domain model: money, observations, batches, mappings and synthetic fixtures"
requires-python = "==3.12.*"
dependencies = ["tzdata==2026.4"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recon_domain"]
