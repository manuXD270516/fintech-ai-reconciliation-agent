[project]
name = "recon-agents"
version = "0.1.0"
description = "Bounded investigation agent: routing, planner/executor over MCP, deterministic evidence phase and model providers"
requires-python = "==3.12.*"
dependencies = [
    "recon-store",
    "mcp==2.2.0",
    "httpx==0.28.1",
    "jsonschema==4.26.0",
]

[tool.uv.sources]
recon-store = { workspace = true }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recon_agents"]
