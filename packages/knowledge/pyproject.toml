[project]
name = "recon-knowledge"
version = "0.1.0"
description = "Synthetic knowledge base: versioned corpus, chunking, local hashing embeddings and hybrid retrieval"
requires-python = "==3.12.*"
dependencies = ["recon-store"]

[tool.uv.sources]
recon-store = { workspace = true }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recon_knowledge"]
