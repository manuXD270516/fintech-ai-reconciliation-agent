[project]
name = "recon-store"
version = "0.1.0"
description = "PostgreSQL persistence (SQLAlchemy Core + Alembic) for the transaction domain"
requires-python = "==3.12.*"
dependencies = [
    "recon-domain",
    "sqlalchemy==2.1.1",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
]

[tool.uv.sources]
recon-domain = { workspace = true }

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recon_store"]
